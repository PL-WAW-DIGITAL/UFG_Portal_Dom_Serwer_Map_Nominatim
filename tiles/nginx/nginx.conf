worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format cache_log '$remote_addr [$time_local] "$request" '
                         '$status $body_bytes_sent '
                         'cache:$upstream_cache_status rt:$request_time '
                         'ups:$upstream_response_time';

    access_log /var/log/nginx/access.log cache_log buffer=64k flush=5s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Open file cache - faster static / cached file serving
    open_file_cache max=20000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_comp_level 4;
    gzip_min_length 128;
    gzip_types application/json application/geo+json application/vnd.mapbox-vector-tile
               application/x-protobuf application/javascript text/plain text/css application/xml;
    gzip_vary on;

    # --- RAM-backed cache zones (tmpfs mounts in compose) ---
    # Nominatim search: hot set of city/street queries
    proxy_cache_path /var/cache/nginx/nominatim
        levels=1:2
        keys_zone=nominatim_cache:128m
        max_size=512m
        inactive=7d
        use_temp_path=off;

    # Vector tiles
    proxy_cache_path /var/cache/nginx/tiles
        levels=1:2
        keys_zone=tile_cache:256m
        max_size=2g
        inactive=14d
        use_temp_path=off;

    # Shared upstream keepalive pools
    upstream nominatim_backend {
        server nominatim:8080;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    upstream martin_backend {
        server martin:3000;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    map $request_method $nominatim_method_bypass {
        default       0;
        POST          1;
        PUT           1;
        DELETE        1;
        PATCH         1;
    }

    # Bench / ops: send header "X-Bypass-Cache: 1" to force upstream (no cache)
    map $http_x_bypass_cache $header_cache_bypass {
        default 0;
        "1"     1;
        "true"  1;
        "yes"   1;
    }

    map "$nominatim_method_bypass$header_cache_bypass" $nominatim_cache_bypass {
        default 0;
        "~1"    1;
    }

    map $http_x_bypass_cache $tile_cache_bypass {
        default 0;
        "1"     1;
        "true"  1;
        "yes"   1;
    }

    # ========== Nominatim (public :8080) ==========
    server {
        listen 8080;
        server_name _;

        location = /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # Never cache status / admin
        location ~ ^/(status|deletable|details) {
            proxy_pass http://nominatim_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header X-Cache-Status BYPASS always;
            add_header Access-Control-Allow-Origin * always;
        }

        # Cache all search / reverse lookups (CBS payload is GET)
        location / {
            proxy_pass http://nominatim_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Accept-Encoding "";

            proxy_cache nominatim_cache;
            # Full URI including query string (city/street/state params)
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_methods GET HEAD;
            proxy_cache_bypass $nominatim_cache_bypass;
            proxy_no_cache $nominatim_cache_bypass;

            # Only cache successful geocoding responses (never 5xx)
            proxy_cache_valid 200 301 7d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 2s;
            proxy_cache_lock_age 5s;
            proxy_cache_revalidate on;
            proxy_cache_min_uses 1;

            # Client / CDN hints
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Access-Control-Allow-Origin * always;

            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 32 16k;
        }
    }

    # ========== Tiles (public :80 -> host 8081) ==========
    server {
        listen 80;
        server_name _;

        location = /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # Martin XYZ tiles: /{source}/{z}/{x}/{y} (+ optional .pbf)
        location ~ "^/[^/]+/[0-9]+/[0-9]+/[0-9]+(\.pbf|\.mvt)?$" {
            proxy_pass http://martin_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Accept-Encoding "";

            proxy_cache tile_cache;
            proxy_cache_key "$request_uri";
            proxy_cache_methods GET HEAD;
            proxy_cache_bypass $tile_cache_bypass;
            proxy_no_cache $tile_cache_bypass;
            proxy_cache_valid 200 14d;
            proxy_cache_valid 204 404 5m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 2s;
            proxy_cache_min_uses 1;

            add_header Cache-Control "public, max-age=1209600, immutable" always;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Access-Control-Allow-Origin * always;

            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_buffering on;
        }

        # TileJSON / catalog - shorter TTL
        location / {
            proxy_pass http://martin_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            proxy_cache tile_cache;
            proxy_cache_key "$request_uri";
            proxy_cache_bypass $tile_cache_bypass;
            proxy_no_cache $tile_cache_bypass;
            proxy_cache_valid 200 1h;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_background_update on;
            proxy_cache_lock on;

            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Access-Control-Allow-Origin * always;
        }
    }
}
